[project]
name = "medved-groq-nlp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
postgres = ["SQLAlchemy[asyncio]>=2.0,<2.1", "alembic>=1.14,<2", "asyncpg>=0.30,<1", "cryptography>=46,<51", "python-dotenv>=1,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

markers = ["postgres: requires a dedicated TEST_DATABASE_URL PostgreSQL database"]
