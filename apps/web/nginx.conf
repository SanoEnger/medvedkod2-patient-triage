map $uri $safe_route {
    default "other";
    ~^/api/v1/chats "chat";
    ~^/api/v1/sessions "survey";
    ~^/api/v1/auth/launch$ "auth";
    ~^/assets/ "asset";
    / "page";
    /healthz "health";
}
map $uri $diagnostic_log { default 1; /healthz 0; }
log_format safe_json escape=json '{"time":"$time_iso8601","service":"web","event":"http.completed","request_id":"$upstream_http_x_request_id","proxy_request_id":"$request_id","route":"$safe_route","status":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time"}';

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/web-secrets/web.crt;
    ssl_certificate_key /run/web-secrets/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout safe_json if=$diagnostic_log;
    error_log /dev/stderr crit;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/web-secrets/ca.crt;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_read_timeout 70s;
    proxy_set_header Host $host;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/(api/v1/|health$|docs$|openapi\.json$) {
        proxy_pass https://api:8443;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
